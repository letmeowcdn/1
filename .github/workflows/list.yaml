name: Update README and files.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README and files.json
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import json

          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          OWNER, NAME = REPO.split("/") if "/" in REPO else (REPO, "")
          BASE = f"https://{OWNER}.github.io/{NAME}"

          EXCLUDE = {"README.md", "files.json", "index.html", "404.html", "info.txt"}


          files = []
          for root, dirs, filenames in os.walk("."):
              if "/.github" in root or "/.git" in root or root.startswith("./.github") or root.startswith("./.git"):
                  continue
              for f in filenames:
                  if f in EXCLUDE:
                      continue
                  path = os.path.relpath(os.path.join(root, f), ".").replace("\\", "/")
                  files.append({"name": path, "url": f"{BASE}/{path}"})
          files.sort(key=lambda x: x["name"])

    
          custom = []
          if os.path.exists("files.json"):
              try:
                  with open("files.json", "r", encoding="utf-8") as fp:
                      old = json.load(fp)
                      custom = old.get("custom", [])
              except Exception as e:
                  print("Ошибка чтения files.json:", e)

  
          data = {
              "base": BASE,
              "count": len(files),
              "custom": custom,
              "files": files
          }
          with open("files.json", "w", encoding="utf-8") as fp:
              json.dump(data, fp, ensure_ascii=False, indent=2)

          # === 4. README из files.json ===
          block_lines = ["<!-- lmcdn -->"]

          if custom:
              block_lines.append("### 🔗 Свои ссылки")
              block_lines.append("")
              for c in custom:
                  block_lines.append(f"- **{c['name']}**")
                  block_lines.append(f"  - {c['url']}")
              block_lines.append("")

          block_lines.append("### 📁 Файлы")
          block_lines.append("")
          for f in files:
              block_lines.append(f"- **{f['name']}**")
              block_lines.append(f"  - {f['url']}")

          block_lines.append("<!-- lmcdn -->")
          block = "\n".join(block_lines)

          with open("README.md", "r", encoding="utf-8") as fp:
              content = fp.read()

          pattern = re.compile(r"<!-- lmcdn -->.*?<!-- lmcdn -->", re.DOTALL)
          if pattern.search(content):
              content = pattern.sub(block, content)
          else:
              content = content.rstrip() + "\n\n" + block + "\n"

          with open("README.md", "w", encoding="utf-8") as fp:
              fp.write(content)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "LetMeow Bot"
          git config user.email "letmeow-bot@users.noreply.github.com"
          git add README.md files.json
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Автообновление README и files.json"
            git push
          fi
