name: Update README and files.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README and files.json
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import json

          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          OWNER, NAME = REPO.split("/") if "/" in REPO else (REPO, "")
          BASE = f"https://{OWNER}.github.io/{NAME}"

          EXCLUDE = {"README.md", "files.json", "index.html", "404.html", "info.txt"}

          files = []
          for root, dirs, filenames in os.walk("."):
              if "/.github" in root or "/.git" in root or root.startswith("./.github") or root.startswith("./.git"):
                  continue
              for f in filenames:
                  if f in EXCLUDE:
                      continue
                  path = os.path.relpath(os.path.join(root, f), ".").replace("\\", "/")
                  files.append(path)
          files.sort()

          # === README ===
          block_lines = ["<!-- lmcdn -->"]
          for f in files:
              url = f"{BASE}/{f}"
              block_lines.append(f"- **{f}**")
              block_lines.append(f"  - {url}")
          block_lines.append("<!-- lmcdn -->")
          block = "\n".join(block_lines)

          with open("README.md", "r", encoding="utf-8") as fp:
              content = fp.read()

          pattern = re.compile(r"<!-- lmcdn -->.*?<!-- lmcdn -->", re.DOTALL)
          if pattern.search(content):
              content = pattern.sub(block, content)
          else:
              content = content.rstrip() + "\n\n" + block + "\n"

          with open("README.md", "w", encoding="utf-8") as fp:
              fp.write(content)

          # === files.json ===
          data = {
              "base": BASE,
              "count": len(files),
              "files": [
                  {"name": f, "url": f"{BASE}/{f}"} for f in files
              ]
          }
          with open("files.json", "w", encoding="utf-8") as fp:
              json.dump(data, fp, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "LetMeow Bot"
          git add README.md files.json
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Автообновление README и files.json"
            git push
          fi
